<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解説ノート | 消防設備士 甲種4類</title>
<meta name="description" content="消防設備士 甲種4類の参考書を、中学生・高校生でも分かるレベルまでかみ砕いた解説ノート">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#f2ede2;
    --surface:#fdfbf6;
    --surface-2:#ece5d5;
    --ink:#211d19;
    --muted:#726b5f;
    --border:#d9d0bd;
    --accent:#b6392a;
    --accent-ink:#fdfbf6;
    --amber:#c98a1f;
    --ok:#3c7d55;
    --ok-bg:#e4efe4;
    --ng:#b6392a;
    --ng-bg:#f6e6e1;
    --shadow: 0 1px 0 rgba(33,29,25,.04), 0 8px 20px -12px rgba(33,29,25,.35);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18191a; --surface:#221f1c; --surface-2:#2b2724; --ink:#efe9e0;
      --muted:#a89f92; --border:#3a352f; --accent:#e2604e; --accent-ink:#1b120f;
      --amber:#e0a83f; --ok:#5cb37c; --ok-bg:#203025; --ng:#e2604e; --ng-bg:#352220;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#18191a; --surface:#221f1c; --surface-2:#2b2724; --ink:#efe9e0;
    --muted:#a89f92; --border:#3a352f; --accent:#e2604e; --accent-ink:#1b120f;
    --amber:#e0a83f; --ok:#5cb37c; --ok-bg:#203025; --ng:#e2604e; --ng-bg:#352220;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans JP',system-ui,'Hiragino Sans','Yu Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px; padding-block:20px 48px;
    display:flex; justify-content:center;
  }
  .wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:16px; }
  h1,h2,h3{font-family:'Zen Kaku Gothic New',sans-serif; text-wrap:balance; margin:0;}

  header.panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    position:sticky; top:12px; z-index:5;
  }
  header .title{ display:block; font-weight:700; font-size:15px; }
  header .sub{ display:block; font-size:11px; color:var(--muted); margin-top:1px; }
  .back-link{
    font-size:12px; color:var(--accent); text-decoration:none; font-weight:700;
    border:1px solid var(--border); border-radius:999px; padding:7px 13px;
    white-space:nowrap; background:var(--surface-2);
  }

  .chapter-head{ margin-top:6px; padding:10px 4px 2px; }
  .chapter-head .eyebrow{ font-size:11px; color:var(--amber); font-weight:700; letter-spacing:.04em; }
  .chapter-head h1{ font-size:20px; margin-top:4px; }

  .section-sub{
    font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.03em;
    margin:4px 4px -4px;
  }

  .note-box{
    background:var(--surface-2); border-radius:10px; padding:10px 12px 10px 13px;
    font-size:12.5px; line-height:1.7; color:var(--ink); margin:2px 0;
    border-left:3px solid var(--amber);
  }
  .note-box b{ color:var(--amber); }
  .note-box.warn{ border-left-color:var(--accent); }
  .note-box.warn b{ color:var(--accent); }
  .hl{
    background:linear-gradient(transparent 58%, rgba(201,138,31,.38) 58%);
    font-weight:700; padding:0 1px;
  }
  .note-box.warn .hl{
    background:linear-gradient(transparent 58%, rgba(182,57,42,.28) 58%);
  }
  .ans{ color:var(--ok); }
  .wrong-term{ color:var(--accent); font-weight:700; }

  .ref{
    font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;
    border-top:1px dashed var(--border); padding-top:8px; margin-top:2px;
  }

  footer{
    text-align:center; font-size:11px; color:var(--muted); line-height:1.8; padding:10px 6px 0;
  }
  footer a{ color:var(--accent); }

  /* ---- practice problem ---- */
  .quiz-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px 18px; display:flex; flex-direction:column; gap:10px;
  }
  .quiz-card .q-no{ font-size:11px; color:var(--muted); font-weight:700; font-family:'JetBrains Mono',monospace; }
  .quiz-card .q-text{ font-size:14.5px; line-height:1.8; font-weight:500; }
  .opt-btn{
    display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; font-size:13.5px; line-height:1.6; color:var(--ink);
    font-family:inherit; cursor:pointer;
  }
  .opt-btn .n{
    flex:none; width:22px; height:22px; border-radius:50%; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  }
  .opt-btn.correct{ background:var(--ok-bg); border-color:var(--ok); }
  .opt-btn.correct .n{ background:var(--ok); color:#fff; border-color:var(--ok); }
  .opt-btn.wrong{ background:var(--ng-bg); border-color:var(--ng); }
  .opt-btn.wrong .n{ background:var(--ng); color:#fff; border-color:var(--ng); }
  .opt-btn.picked{ background:color-mix(in srgb, var(--accent) 14%, var(--surface-2)); border-color:var(--accent); }
  .opt-btn.picked .n{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .opt-btn.missed{ border-color:var(--ok); border-style:dashed; }
  .opt-btn.missed .n{ border-color:var(--ok); color:var(--ok); }
  .opt-btn[data-picked]{ cursor:default; }
  .submit-row{ display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  .picked-count{ font-size:11px; color:var(--muted); margin-right:auto; }
  .submit-btn{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:12.5px; color:var(--accent-ink);
    background:var(--accent); border:none; border-radius:999px; padding:9px 18px; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.4; cursor:default; }
  .q-feedback{
    display:none; background:var(--surface-2); border-radius:10px; padding:13px 14px;
    font-size:13.5px; line-height:1.85;
  }
  .q-feedback.show{ display:flex; flex-direction:column; gap:8px; }
  .q-feedback .verdict{ font-weight:700; font-size:14px; }
  .q-feedback .verdict.ok{ color:var(--ok); }
  .q-feedback .verdict.ng{ color:var(--accent); }
  .q-feedback .note-box{ background:var(--surface); }

  .mini-note{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 16px; font-size:13px; line-height:1.85;
  }
  table.simple{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.simple th, table.simple td{
    border:1px solid var(--border); padding:7px 9px; text-align:left; vertical-align:top; line-height:1.6;
  }
  table.simple th{ background:var(--surface-2); font-weight:700; }

  .chapter-tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .chapter-tab{
    flex:1; min-width:88px; padding:11px 8px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-weight:700; font-size:12.5px; cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .chapter-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .chapter-tab:active{transform:translateY(1px);}

  .sec-list{display:flex; flex-direction:column; gap:7px;}
  .sec-row{
    display:flex; align-items:center; gap:10px; width:100%; padding:11px 13px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer;
    text-align:left; font-family:inherit; font-size:13px;
  }
  .sec-row .num{
    flex:none; width:24px; height:24px; border-radius:50%; background:var(--surface-2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  }
  .sec-row .label{flex:1; font-weight:500; line-height:1.4;}
  .sec-row .state{flex:none; font-size:10.5px; color:var(--muted); white-space:nowrap;}
  .sec-row.ready .num{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .sec-row.ready .state{color:var(--ok); font-weight:700;}
  .sec-row.disabled{opacity:.55; cursor:default;}
  .sec-row:not(.disabled):active{transform:translateY(1px);}

  .sec-content{display:flex; flex-direction:column; gap:14px;}
  .back-to-list{
    align-self:flex-start; font-size:12px; font-weight:700; color:var(--accent);
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px;
    padding:7px 13px; cursor:pointer; font-family:inherit;
  }
  .back-to-list:active{transform:translateY(1px);}
</style>
</head>
<body>
<div class="wrap">

  <header class="panel">
    <div>
      <span class="title">📙 公論出版 甲種4類</span>
      <span class="sub">参考書をやさしくかみくだき中</span>
    </div>
    <a class="back-link" href="index.html">トップページに戻る</a>
  </header>

  <div class="chapter-tabs" id="chapterTabs">
    <button type="button" class="chapter-tab active" data-chapter="1">1章 共通法令</button>
    <button type="button" class="chapter-tab" data-chapter="2">2章</button>
    <button type="button" class="chapter-tab" data-chapter="3">3章</button>
  </div>

  <div class="chapter-panel" data-chapter="1">
    <div class="sec-list" id="secList-1"></div>

    <div class="sec-content" id="secContent-1-1" hidden>
      <button type="button" class="back-to-list" data-chapter="1">← 節一覧に戻る</button>
      <div class="chapter-head">
        <div class="eyebrow">CHAPTER 1 ・ 1節</div>
        <h1>消防法令上の定義</h1>
      </div>
      <div class="section-sub">📝 過去問 1節【1】〜【3】</div>
      <div id="quizArea-ch1-1"></div>
    </div>
  </div>
  <div class="chapter-panel" data-chapter="2" hidden>
    <div class="mini-note" style="text-align:center; color:var(--muted);">準備中です。</div>
  </div>
  <div class="chapter-panel" data-chapter="3" hidden>
    <div class="mini-note" style="text-align:center; color:var(--muted);">準備中です。</div>
  </div>

  <footer>
    このノートは参考書の内容を自分なりの言葉でかみくだいた要約です。正式な条文・基準は必ず原本や公式資料で確認してください。<br>
    <a href="index.html">← クイズのトップに戻る</a>
  </footer>

</div>

<script>
(function(){
  // 章ごとの過去問データはここに PROBLEMS_X 配列として追加し、
  // renderQuiz(PROBLEMS_X, 'quizAreaX') を呼び出す形式で再利用する。
  // 節の本文を追加するときは、その節の見出しブロックに id="ch1-sec{N}" を付けること。
  // (下の一覧が自動的にタップ可能になる)

  var CH1_SECTIONS = [
    "消防法令上の定義", "消防法の基本", "防火対象物の区分", "防火対象物の適用",
    "消防用設備等の種類", "既存防火対象物に対する適用除外", "既存防火対象物の用途変更の特例",
    "定期点検及び報告", "防火対象物点検資格者", "消防用設備等の届出及び検査",
    "工事整備対象設備等の着工届", "消防用設備等の設置命令と維持命令",
    "消防設備士でなければ行ってはならない工事又は整備", "消防用設備等の技術上の基準と異なる規定",
    "基準の特例", "消防設備士の免状", "消防設備士免状の取り扱い", "消防設備士の講習",
    "消防設備士の義務", "防火管理者", "検定制度"
  ];

  function renderSecList(sections, chapterNo, containerId){
    var area = document.getElementById(containerId);
    var listWrap = document.getElementById('secList-' + chapterNo);
    sections.forEach(function(title, i){
      var secNo = i + 1;
      var contentId = 'secContent-' + chapterNo + '-' + secNo;
      var exists = !!document.getElementById(contentId);

      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'sec-row' + (exists ? ' ready' : ' disabled');

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = secNo;
      row.appendChild(num);

      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = title;
      row.appendChild(label);

      var state = document.createElement('span');
      state.className = 'state';
      state.textContent = exists ? '解説あり' : '準備中';
      row.appendChild(state);

      if(exists){
        row.addEventListener('click', function(){
          listWrap.hidden = true;
          document.getElementById(contentId).hidden = false;
        });
      }else{
        row.disabled = true;
      }

      area.appendChild(row);
    });
  }

  document.querySelectorAll('.back-to-list').forEach(function(btn){
    btn.addEventListener('click', function(){
      var chapterNo = btn.getAttribute('data-chapter');
      btn.closest('.sec-content').hidden = true;
      document.getElementById('secList-' + chapterNo).hidden = false;
    });
  });

  function renderQuiz(problems, containerId){
  var area = document.getElementById(containerId);

  problems.forEach(function(p){
    var card = document.createElement('div');
    card.className = 'quiz-card';

    var noEl = document.createElement('div');
    noEl.className = 'q-no';
    noEl.textContent = '過去問 ' + p.no;
    card.appendChild(noEl);

    var qEl = document.createElement('div');
    qEl.className = 'q-text';
    qEl.textContent = p.q;
    card.appendChild(qEl);

    var fb = document.createElement('div');
    fb.className = 'q-feedback';

    function showFeedback(isCorrect){
      fb.classList.add('show');
      var verdict = document.createElement('div');
      verdict.className = 'verdict ' + (isCorrect ? 'ok' : 'ng');
      verdict.textContent = isCorrect ? '○ 正解' : '✕ 不正解';
      var ex = document.createElement('div');
      ex.innerHTML = p.ex;
      fb.innerHTML = '';
      fb.appendChild(verdict);
      fb.appendChild(ex);
    }

    if(p.type === 'multi'){
      var answered = false;
      var picked = [];
      var btns = [];

      p.opts.forEach(function(optText, i){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn';
        btn.innerHTML = '<span class="n">'+(i+1)+'</span><span>'+optText+'</span>';
        btn.addEventListener('click', function(){
          if(answered) return;
          var idx = picked.indexOf(i);
          if(idx === -1){ picked.push(i); btn.classList.add('picked'); }
          else{ picked.splice(idx,1); btn.classList.remove('picked'); }
        });
        btns.push(btn);
        card.appendChild(btn);
      });

      var submitRow = document.createElement('div');
      submitRow.className = 'submit-row';
      var hint = document.createElement('div');
      hint.className = 'picked-count';
      hint.textContent = p.answer.length + 'つ選んで答え合わせ';
      submitRow.appendChild(hint);
      var submitBtn = document.createElement('button');
      submitBtn.type = 'button';
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = '答え合わせ';
      submitBtn.addEventListener('click', function(){
        if(answered || picked.length === 0) return;
        answered = true;
        var answerSet = p.answer.slice().sort();
        var pickedSet = picked.slice().sort();
        var isCorrect = JSON.stringify(answerSet) === JSON.stringify(pickedSet);
        btns.forEach(function(b, i){
          var inAnswer = p.answer.indexOf(i) !== -1;
          var wasPicked = picked.indexOf(i) !== -1;
          b.classList.remove('picked');
          b.setAttribute('data-picked','1');
          if(wasPicked && inAnswer) b.classList.add('correct');
          else if(wasPicked && !inAnswer) b.classList.add('wrong');
          else if(!wasPicked && inAnswer) b.classList.add('missed');
        });
        submitBtn.disabled = true;
        showFeedback(isCorrect);
      });
      submitRow.appendChild(submitBtn);
      card.appendChild(submitRow);

    }else{
      var answered2 = false;
      var btns2 = [];
      p.opts.forEach(function(optText, i){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn';
        btn.innerHTML = '<span class="n">'+(i+1)+'</span><span>'+optText+'</span>';
        btn.addEventListener('click', function(){
          if(answered2) return;
          answered2 = true;
          btns2.forEach(function(b, bi){
            b.setAttribute('data-picked','1');
            if(bi === p.answer) b.classList.add('correct');
            if(bi === i && i !== p.answer) b.classList.add('wrong');
          });
          showFeedback(i === p.answer);
        });
        btns2.push(btn);
        card.appendChild(btn);
      });
    }

    card.appendChild(fb);
    area.appendChild(card);
  });
  }

  var PROBLEMS_CH1_1 = [
    {
      no: "1節 【1】", type: "single",
      q: "消防法令に定める「関係者」として、誤っているものは次のうちどれか。",
      opts: ["防火対象物の管理者","消防対象物の所有者","防火対象物の防火管理者","消防対象物の占有者"],
      answer: 2,
      ex: "<b class='ans'>正解は③「防火対象物の防火管理者」。</b>"
        + "<p style='margin:6px 0 0'>「関係者」は法律上、<span class='hl'>所有者・管理者・占有者</span>の3種類だけを指す言葉です。</p>"
        + "<div class='note-box warn'><b>⚠ ひっかけ注意:</b> <span class='hl'>「防火管理者」は関係者には含まれません</span>。防火管理者は、関係者(所有者など)の中から選ばれて実際の防火管理の実務を行う人のことで、別の役割です。「関係者として誤っているものはどれか」という問題で、選択肢に紛れ込んでくる定番パターンです。</div>"
        + "<div class='ref'>法第2条4項</div>"
    },
    {
      no: "1節 【2】", type: "single",
      q: "無窓階の説明として、消防法令上、正しいものは次のうちどれか。",
      opts: [
        "建築物の外壁に窓を有しない階",
        "採光上又は排煙上有効な開口部を有しない階",
        "排煙上又は消火活動上有効な窓が一定基準に達しない階",
        "消火活動上有効な窓が一定基準に達しない階",
        "消火活動上有効な窓を有しない階",
        "避難上又は排煙上有効な開口部が一定基準に達しない階",
        "窓を有しない階",
        "避難上又は消火活動上有効な開口部を有しない階"
      ],
      answer: 7,
      ex: "<b class='ans'>正解は⑧「避難上又は消火活動上有効な開口部を有しない階」。</b>"
        + "<p style='margin:6px 0 0'>令第10条1項5号に定められた無窓階の正式な定義文そのままです。</p>"
        + "<div class='note-box warn'><b>⚠ ひっかけ注意:</b> 他の選択肢は、<span class='hl'>「避難上」を「採光上」「排煙上」に、「開口部」を「窓」に</span>すり替えたり、「有しない階」を「一定基準に達しない階」のような曖昧な表現に変えたりした、ほぼ同じに見える紛らわしい文です。法令の正式な言い回しを<span class='hl'>一字一句正確に</span>覚えているかを試す問題なので、キーワード(避難上・消火活動上・開口部・有しない)をセットで覚えるのがコツです。</div>"
        + "<div class='ref'>令第10条1項5号</div>"
    },
    {
      no: "1節 【3】", type: "multi",
      q: "消防法令に定められている用語の定義として、誤っているものを3つ選びなさい。",
      opts: [
        "防火対象物とは、山林または舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物又は物件をいう。",
        "消防対象物とは、山林または舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物若しくはこれらに属する物をいう。",
